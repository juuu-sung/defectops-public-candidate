[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defectops"
version = "0.1.0"
description = "Human-in-the-loop visual anomaly inspection and response copilot"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["Pillow==11.3.0", "numpy==2.3.3"]

[tool.setuptools.packages.find]
where = ["src"]
