[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defectops"
version = "0.1.0"
description = "Human-in-the-loop visual anomaly inspection and response copilot"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["Pillow==11.3.0", "numpy==2.3.3"]
test = [
  "Pillow==11.3.0",
  "numpy==2.3.3",
  "fastapi==0.117.1",
  "uvicorn==0.37.0",
  "httpx==0.28.1",
  "streamlit==1.64.0",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
defectops = ["history_migrations/*.json"]
